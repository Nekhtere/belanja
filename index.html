<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#faf9f7" />
    <meta name="color-scheme" content="light" />

    <title>RUPA — Pakaian, Tas &amp; Parfum Pilihan</title>
    <meta
      name="description"
      content="Toko kurasi pakaian, tas, parfum dan aksesori. Potongan bersih, bahan yang bertahan lama, harga yang jujur."
    />

    <!--
      Fonts: preconnect first so the handshake overlaps CSS parsing, then load
      with the print-media swap trick so the stylesheet never blocks first paint.
      The noscript fallback keeps the page correct without JS.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500&display=swap"
      />
    </noscript>

    <style>
      /* The ground colour from the first byte so there is no flash of white
         before the bundle boots. Kept in sync with --color-ground. */
      html,
      body {
        margin: 0;
        background: #faf9f7;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
